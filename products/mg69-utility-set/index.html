<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MG69 Utility Set</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
      :root { --b:#050505; --c:#f4ead8; --g:#d7a84a; --l:rgba(244,234,216,.14); }
      * { box-sizing: border-box; }
      body { margin:0; background:var(--b); color:var(--c); font-family:Inter,Arial,sans-serif; }
      a { color:inherit; text-decoration:none; }
      img { display:block; max-width:100%; }
      button { border:0; color:inherit; font:inherit; cursor:pointer; }
      .top { position:sticky; top:0; z-index:10; display:grid; grid-template-columns:auto 1fr auto; gap:22px; align-items:center; padding:14px 34px; background:rgba(5,5,5,.92); border-bottom:1px solid var(--l); backdrop-filter:blur(18px); }
      .brand { display:flex; gap:12px; align-items:center; font-family:"Bebas Neue"; font-size:38px; letter-spacing:.08em; }
      .brand img { width:44px; height:44px; border-radius:50%; object-fit:cover; box-shadow:0 0 28px rgba(215,168,74,.35); }
      .nav { display:flex; justify-content:center; gap:28px; font-size:12px; font-weight:900; letter-spacing:.18em; text-transform:uppercase; color:#cfc4b2; }
      .pill { padding:12px 18px; border:1px solid rgba(215,168,74,.5); border-radius:999px; color:var(--g); font-size:12px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; }
      .page { display:grid; grid-template-columns:96px minmax(0,1fr) 430px; gap:22px; width:min(100% - 32px,1520px); margin:0 auto; padding:24px 0 70px; }
      .thumbs { position:sticky; top:92px; display:grid; gap:10px; height:max-content; }
      .thumb { border:1px solid var(--l); background:#111; padding:4px; border-radius:10px; overflow:hidden; }
      .thumb.active { border-color:var(--g); box-shadow:0 0 0 1px var(--g); }
      .thumb img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:6px; }
      .thumb span { display:block; padding:6px 3px 2px; font-size:9px; font-weight:900; letter-spacing:.12em; text-align:center; text-transform:uppercase; }
      .viewer { position:relative; min-height:760px; background:#111; border:1px solid var(--l); overflow:hidden; }
      .viewer img { width:100%; height:760px; object-fit:contain; object-position:center; transition:transform .45s ease; }
      .viewer:hover img { transform:scale(1.05); }
      .label { position:absolute; left:18px; bottom:18px; padding:10px 14px; border-radius:999px; background:rgba(5,5,5,.72); border:1px solid var(--l); color:var(--g); font-size:12px; font-weight:900; letter-spacing:.15em; text-transform:uppercase; }
      .arrows { position:absolute; right:16px; bottom:16px; display:flex; gap:8px; }
      .arrows button,.zoom { width:44px; height:44px; border-radius:50%; border:1px solid var(--l); background:rgba(5,5,5,.75); font-size:20px; }
      .zoom { position:absolute; right:16px; top:16px; }
      .panel { position:sticky; top:92px; height:max-content; padding:28px; background:#10100f; border:1px solid var(--l); }
      .eyebrow { margin:0 0 12px; color:var(--g); font-size:12px; font-weight:900; letter-spacing:.22em; text-transform:uppercase; }
      h1 { font-family:"Bebas Neue"; font-size:74px; line-height:.86; margin:0 0 12px; letter-spacing:.04em; }
      .price { font-size:28px; color:var(--g); font-weight:900; }
      .copy { color:#bdb4a4; line-height:1.7; }
      .colors,.sizes,.qty { display:flex; gap:10px; flex-wrap:wrap; margin:12px 0 24px; }
      .color,.size,.q,.cart,.wish { border:1px solid var(--l); background:#181816; border-radius:999px; padding:14px 18px; font-weight:900; }
      .color.active,.size.active { border-color:var(--g); color:var(--g); }
      .cart { width:100%; background:linear-gradient(135deg,#f3cf78,#d7a84a); color:#050505; margin-top:8px; }
      .wish { width:100%; }
      .box { position:fixed; inset:0; z-index:50; display:none; place-items:center; background:rgba(0,0,0,.9); padding:28px; }
      .box.open { display:grid; }
      .box img { max-height:88vh; width:min(92vw,1100px); object-fit:contain; }
      .close { position:fixed; top:20px; right:20px; width:48px; height:48px; border-radius:50%; background:var(--g); color:#050505; font-size:24px; }
      @media (max-width:980px) { .nav{display:none}.page{grid-template-columns:1fr}.thumbs{position:static;display:flex;overflow-x:auto}.thumb{flex:0 0 94px}.viewer,.viewer img{height:560px;min-height:560px}.panel{position:static}.top{padding:12px 16px}.brand{font-size:30px} }
      @media (max-width:560px) { .viewer,.viewer img{height:470px;min-height:470px} h1{font-size:54px}.page{width:min(100% - 20px,1520px)} }
    </style>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/mg69-street-luxury/"><img src="/mg69-street-luxury/public/brand/mg69-logo3.png" alt="MG69 logo" /><span>MG69</span></a>
      <nav class="nav"><a href="/mg69-street-luxury/#men">Men</a><a href="/mg69-street-luxury/#new-arrivals">New Arrivals</a><a href="/mg69-street-luxury/#women">Women</a></nav>
      <a class="pill" href="/mg69-street-luxury/">Store</a>
    </header>
    <main class="page">
      <aside class="thumbs" id="thumbs"></aside>
      <section class="viewer" id="viewer">
        <button class="zoom" id="zoom" type="button">⌕</button>
        <img id="hero" alt="MG69 Utility Set product view" />
        <span class="label" id="viewLabel"></span>
        <div class="arrows"><button id="prev" type="button">‹</button><button id="next" type="button">›</button></div>
      </section>
      <aside class="panel">
        <p class="eyebrow">Men / MG69 Utility Collection</p>
        <h1>MG69 Utility Set</h1>
        <div class="price">$169</div>
        <p class="copy">Premium oversized utility bomber jacket paired with cargo pants. Built for comfort, confidence, and luxury streetwear styling.</p>
        <p class="eyebrow">Color</p><div class="colors" id="colors"></div>
        <p class="eyebrow">Size</p><div class="sizes" id="sizes"></div>
        <p class="eyebrow">Quantity</p><div class="qty"><button class="q" id="minus" type="button">−</button><button class="q" id="count" type="button">1</button><button class="q" id="plus" type="button">+</button></div>
        <button class="cart" id="cart" type="button">Add to Cart</button>
        <button class="wish" type="button">Add to Wishlist</button>
        <p class="copy" id="status">Separate ecommerce gallery. No poster collage.</p>
      </aside>
    </main>
    <div class="box" id="box"><button class="close" id="close" type="button">×</button><img id="boxImg" alt="Expanded MG69 product" /></div>
    <script>
      const base = "/mg69-street-luxury/public/utility/products/";
      const colors = [{ n: "Stone Grey", s: "stone-grey" }, { n: "Matte Black", s: "matte-black" }, { n: "Dark Olive", s: "dark-olive" }];
      const views = [["Front View", "front-view"], ["Back View", "back-view"], ["Left Side View", "left-side-view"], ["Right Side View", "right-side-view"], ["Model Front View", "model-front-view"], ["Model Back View", "model-back-view"], ["Flat Lay Front", "flat-lay-front"], ["Flat Lay Back", "flat-lay-back"]];
      let c = 0, i = 0, q = 1, sx = 0;
      const heroImg = document.getElementById("hero"), label = document.getElementById("viewLabel");
      const srcFor = (color, view) => `${base}${color.s}-${view[1]}.webp`;
      function render() {
        const view = views[i];
        heroImg.src = srcFor(colors[c], view);
        label.textContent = `${view[0]} / ${colors[c].n}`;
        document.getElementById("thumbs").innerHTML = views.map((viewItem, index) => `<button class="thumb ${index === i ? "active" : ""}" data-i="${index}" type="button"><img src="${srcFor(colors[c], viewItem)}" alt="${viewItem[0]}"><span>${viewItem[0]}</span></button>`).join("");
        document.getElementById("colors").innerHTML = colors.map((color, index) => `<button class="color ${index === c ? "active" : ""}" data-c="${index}" type="button">${color.n}</button>`).join("");
      }
      function sizes() {
        document.getElementById("sizes").innerHTML = ["S", "M", "L", "XL", "XXL"].map((size, index) => `<button class="size ${index === 1 ? "active" : ""}" type="button">${size}</button>`).join("");
      }
      document.addEventListener("click", (event) => {
        const thumb = event.target.closest("[data-i]");
        if (thumb) { i = Number(thumb.dataset.i); render(); }
        const color = event.target.closest("[data-c]");
        if (color) { c = Number(color.dataset.c); i = 0; render(); }
        if (event.target.classList.contains("size")) { document.querySelectorAll(".size").forEach((el) => el.classList.remove("active")); event.target.classList.add("active"); }
      });
      document.getElementById("next").onclick = () => { i = (i + 1) % views.length; render(); };
      document.getElementById("prev").onclick = () => { i = (i - 1 + views.length) % views.length; render(); };
      document.getElementById("plus").onclick = () => { q = Math.min(25, q + 1); count.textContent = q; };
      document.getElementById("minus").onclick = () => { q = Math.max(1, q - 1); count.textContent = q; };
      document.getElementById("zoom").onclick = () => { box.classList.add("open"); boxImg.src = heroImg.src; };
      document.getElementById("close").onclick = () => box.classList.remove("open");
      document.getElementById("cart").onclick = () => {
        const cart = JSON.parse(localStorage.getItem("mg69-cart") || "[]");
        cart.push({ productId: "mg69-utility-set", name: "MG69 Utility Set", price: 169, color: colors[c].n, size: document.querySelector(".size.active").textContent, quantity: q, image: srcFor(colors[c], views[0]) });
        localStorage.setItem("mg69-cart", JSON.stringify(cart));
        status.textContent = `Added to cart: ${q} / ${colors[c].n}`;
      };
      viewer.addEventListener("touchstart", (event) => { sx = event.touches[0].clientX; });
      viewer.addEventListener("touchend", (event) => { const dx = event.changedTouches[0].clientX - sx; if (Math.abs(dx) > 50) { i = dx < 0 ? (i + 1) % views.length : (i - 1 + views.length) % views.length; render(); } });
      sizes();
      render();
    </script>
  </body>
</html>
